<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>自动投递配置</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 24px; background: #f5f5f7; margin:0; }
    .container { max-width: 560px; margin: 0 auto; }
    h1 { margin: 0 0 4px 0; color: #1d1d1f; font-weight: 700; font-size: 22px; }
    .subtitle { color: #6e6e73; font-size: 13px; margin: 0 0 20px 0; }
    .section { background: white; border: 1px solid #e5e5ea; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .section-title { font-size: 15px; font-weight: 600; color: #1d1d1f; margin: 0 0 12px 0; display: flex; align-items: center; gap: 8px; }
    .section-num { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: #0071e3; color: white; font-size: 12px; font-weight: 600; }
    .platform-row { display: flex; gap: 12px; }
    .platform-card { flex: 1; border: 2px solid #e5e5ea; border-radius: 10px; padding: 14px; cursor: pointer; text-align: center; transition: all 0.15s; }
    .platform-card.selected { border-color: #0071e3; background: #f0f7ff; }
    .platform-card .pname { font-size: 15px; font-weight: 600; color: #1d1d1f; }
    .platform-card .pdesc { font-size: 11px; color: #86868b; margin-top: 4px; }
    .field { margin-bottom: 12px; }
    label { display: block; font-size: 12px; color: #6e6e73; margin-bottom: 4px; font-weight: 500; }
    input, textarea, select { width: 100%; padding: 8px 10px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 14px; background: white; }
    textarea { min-height: 64px; font-family: inherit; resize: vertical; }
    .add-row { display: flex; gap: 8px; }
    .add-row input { flex: 1; }
    .add-row select { width: 120px; }
    .btn-add { background: #0071e3; color: white; border: none; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 13px; white-space: nowrap; }
    .btn-add:hover { background: #0060c0; }
    .account-list { margin-top: 12px; }
    .account-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: #f5f5f7; border-radius: 8px; margin-bottom: 6px; font-size: 13px; }
    .account-item .plat-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    .plat-tag.liepin { background: #e8f4fd; color: #0a7ea4; }
    .plat-tag.boss { background: #e8f9f0; color: #0a8a4a; }
    .account-item .del { color: #ff3b30; cursor: pointer; font-size: 12px; border: none; background: none; }
    .mode-row { display: flex; gap: 12px; }
    .mode-card { flex: 1; border: 2px solid #e5e5ea; border-radius: 10px; padding: 12px; cursor: pointer; }
    .mode-card.selected { border-color: #0071e3; background: #f0f7ff; }
    .mode-card input[type=radio] { display: none; }
    .mode-card .mname { font-size: 14px; font-weight: 600; }
    .mode-card .mdesc { font-size: 11px; color: #86868b; margin-top: 4px; }
    .schedule-hint { font-size: 12px; color: #6e6e73; margin-top: 10px; display: none; }
    .schedule-hint.show { display: block; }
    .actions { display: flex; gap: 12px; margin-top: 20px; }
    .btn-start { flex: 1; background: #0071e3; color: white; border: none; border-radius: 10px; padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn-start:hover { background: #0060c0; }
    .btn-secondary { background: #e8e8ed; color: #1d1d1f; border: none; border-radius: 10px; padding: 12px 20px; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <h1>自动投递配置</h1>
    <p class="subtitle">配置投递平台、账号与投递方式，开始自动投递</p>

    <!-- ① 选择投递平台 -->
    <div class="section">
      <div class="section-title"><span class="section-num">1</span>选择投递平台</div>
      <div class="platform-row">
        <div class="platform-card selected" id="plat-liepin" onclick="togglePlatform('liepin')">
          <div class="pname">猎聘</div>
          <div class="pdesc">中高端职位 · 简历投递</div>
        </div>
        <div class="platform-card" id="plat-boss" onclick="togglePlatform('boss')">
          <div class="pname">Boss直聘</div>
          <div class="pdesc">直接沟通 · 打招呼</div>
        </div>
      </div>
    </div>

    <!-- ② 投递账号 -->
    <div class="section">
      <div class="section-title"><span class="section-num">2</span>投递账号</div>
      <div class="add-row">
        <input id="accName" placeholder="账号名称（如：主账号）">
        <select id="accPlatform">
          <option value="liepin">猎聘</option>
          <option value="boss">Boss直聘</option>
        </select>
        <button class="btn-add" onclick="addAccount()">添加账号</button>
      </div>
      <div class="account-list" id="accountList"></div>
    </div>

    <!-- ③ 投递方式 -->
    <div class="section">
      <div class="section-title"><span class="section-num">3</span>投递方式</div>
      <div class="mode-row">
        <div class="mode-card selected" id="mode-manual" onclick="selectMode('manual')">
          <input type="radio" name="mode" value="manual" checked>
          <div class="mname">手动投递</div>
          <div class="mdesc">点击开始后立即投递</div>
        </div>
        <div class="mode-card" id="mode-schedule" onclick="selectMode('schedule')">
          <input type="radio" name="mode" value="schedule">
          <div class="mname">定时投递</div>
          <div class="mdesc">按设定时间自动投递</div>
        </div>
      </div>
      <div class="schedule-hint" id="scheduleHint">定时投递将在"定时设置"中配置具体时间区间</div>
    </div>

    <!-- ④ 基本设置 -->
    <div class="section">
      <div class="section-title"><span class="section-num">4</span>基本设置</div>
      <div class="field">
        <label>搜索关键词（每行一个）</label>
        <textarea id="searchKw" placeholder="总经理&#10;总监&#10;负责人"></textarea>
      </div>
      <div class="field">
        <label>岗位筛选关键词（每行一个，职位标题需包含其一）</label>
        <textarea id="jobTitleKw" placeholder="总经理&#10;负责人&#10;总监"></textarea>
      </div>
      <div class="field">
        <label>招呼语</label>
        <input id="greeting" value="您好，看到贵公司在找相关岗位候选人，方便沟通下吗？">
      </div>
    </div>

    <div class="actions">
      <button class="btn-secondary" onclick="window.close()">取消</button>
      <button class="btn-start" onclick="startApply()">开始投递</button>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    var selectedPlatforms = ['liepin'];
    var accounts = [];

    function togglePlatform(p) {
      var idx = selectedPlatforms.indexOf(p);
      if (idx >= 0) selectedPlatforms.splice(idx, 1);
      else selectedPlatforms.push(p);
      var el = document.getElementById('plat-' + p);
      el.classList.toggle('selected');
    }

    function addAccount() {
      var name = document.getElementById('accName').value.trim();
      var plat = document.getElementById('accPlatform').value;
      if (!name) { alert('请输入账号名称'); return; }
      accounts.push({ name: name, platform: plat });
      document.getElementById('accName').value = '';
      renderAccounts();
    }

    function renderAccounts() {
      var list = document.getElementById('accountList');
      list.innerHTML = '';
      accounts.forEach(function(a, i) {
        var item = document.createElement('div');
        item.className = 'account-item';
        var tag = a.platform === 'liepin' ? '猎聘' : 'Boss直聘';
        item.innerHTML = '<span>' + a.name + ' <span class="plat-tag ' + a.platform + '">' + tag + '</span></span>' +
          '<button class="del" onclick="removeAccount(' + i + ')">删除</button>';
        list.appendChild(item);
      });
    }

    function removeAccount(i) {
      accounts.splice(i, 1);
      renderAccounts();
    }

    function selectMode(m) {
      document.getElementById('mode-manual').classList.toggle('selected', m === 'manual');
      document.getElementById('mode-schedule').classList.toggle('selected', m === 'schedule');
      document.getElementById('scheduleHint').classList.toggle('show', m === 'schedule');
    }

    function startApply() {
      var search = document.getElementById('searchKw').value.split('\n').filter(function(s){ return s.trim(); });
      var jobTitle = document.getElementById('jobTitleKw').value.split('\n').filter(function(s){ return s.trim(); });
      var greeting = document.getElementById('greeting').value.trim();
      var mode = document.querySelector('input[name=mode]:checked').value;

      var payload = {
        platforms: selectedPlatforms,
        accounts: accounts,
        mode: mode,
        search: search,
        jobTitle: jobTitle,
        greeting: greeting,
      };
      ipcRenderer.send('login-config-saved', payload);
      window.close();
    }
  </script>
</body>
</html>
